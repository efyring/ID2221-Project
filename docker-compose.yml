services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: id2221-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: id2221-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --create \
          --if-not-exists \
          --topic opensky-states \
          --bootstrap-server kafka:29092 \
          --partitions 1 \
          --replication-factor 1
    restart: "no"

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: id2221-namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: id2221-datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: id2221-spark-master
    depends_on:
      - namenode
      - datanode
    environment:
      SPARK_MODE: master
      # Advertise a stable DNS name (not the ephemeral container id).
      SPARK_MASTER_HOST: spark-master
      TRAIN_DATA_PATH: hdfs://namenode:8020/data/historical_opensky
      MODEL_OUTPUT_PATH: hdfs://namenode:8020/models/delay_gbt_pipeline
      CHECKPOINT_PATH: hdfs://namenode:8020/checkpoints/opensky_kafka
      PYTHONPATH: /opt/bitnami/spark/python:/opt/project/src
      HOME: /opt/bitnami/spark
      USER: spark
      HADOOP_USER_NAME: root
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/project/src:ro

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: id2221-spark-worker
    depends_on:
      - spark-master
      - namenode
      - datanode
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      HOME: /opt/bitnami/spark
      USER: spark
      HADOOP_USER_NAME: root
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
    volumes:
      - ./src:/opt/project/src:ro

  ingest:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: id2221-ingest
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    environment:
      # local[*] avoids depending on worker registration for streaming writes.
      SPARK_MASTER: "local[*]"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: opensky-states
      TRAIN_DATA_PATH: hdfs://namenode:8020/data/historical_opensky
      MODEL_OUTPUT_PATH: hdfs://namenode:8020/models/delay_gbt_pipeline
      CHECKPOINT_PATH: hdfs://namenode:8020/checkpoints/opensky_kafka
      RETRAIN_EVERY_N_BATCHES: "1"
      LOG_LEVEL: INFO
      PYTHONPATH: /opt/bitnami/spark/python:/opt/project/src
      SPARK_HOME: /opt/bitnami/spark
      IVY_HOME: /opt/bitnami/spark/.ivy2
      HOME: /opt/bitnami/spark
      USER: spark
      HADOOP_USER_NAME: root
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
    volumes:
      - ./src:/opt/project/src:ro
    entrypoint: ["/opt/bitnami/spark/venv/bin/python"]
    command: ["/opt/project/src/spark/ingest.py"]
    restart: unless-stopped

volumes:
  kafka_data:
  hdfs_namenode:
  hdfs_datanode:
